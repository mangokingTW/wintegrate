[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "wintegrate"
version = "0.5.5"
description = "Integrate Windows desktop apps into modern CI: UI automation for unattended headless runners."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mango Yen", email = "mango.yen.tw@gmail.com" }
]
keywords = [
    "windows",
    "ui-automation",
    "uia",
    "ci",
    "testing",
    "gui-testing",
    "arm64",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "comtypes>=1.4.16",
]

[project.optional-dependencies]
# Screen recording, failure screenshots, and the frame pipeline. PyAV bundles
# FFmpeg and is the only option with a win_arm64 wheel on PyPI, so recording
# works out of the box on Windows ARM64 too.
video = [
    "pillow>=12.3.0",
    "av>=15.0.0",
]
# Virtual desktop clean-room isolation. pyvda wraps undocumented COM interfaces
# whose GUIDs change between Windows builds, which is why it stays optional.
desktop = [
    "pyvda>=0.6.0",
]
all = [
    "wintegrate[video,desktop]",
]
dev = [
    "wintegrate[all]",
    "hypothesis>=6.140.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://mangokingtw.github.io/wintegrate/"
Documentation = "https://mangokingtw.github.io/wintegrate/"
Repository = "https://github.com/mangokingTW/wintegrate"
Issues = "https://github.com/mangokingTW/wintegrate/issues"
Changelog = "https://github.com/mangokingTW/wintegrate/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/wintegrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "desktop_only: mark test to run only on Windows Desktop / Client editions",
    "server_only: mark test to run only on Windows Server editions",
    "target_app: drives a third-party application that has to be installed first",
    "upstream_bug: reproduces a fixed upstream bug against the build that had it",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

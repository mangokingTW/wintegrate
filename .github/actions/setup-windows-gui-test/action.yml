name: Set up a Windows GUI test runner
description: >
  Prepares a hosted Windows runner for driving a real desktop application: quiets
  the things that steal the foreground and installs wintegrate.

# Why this exists as an action rather than as steps copied into each workflow:
# the arm64 preparation was copied by hand into four reproduction workflows, and
# the copy was broken. `wsl --update` answers "The Windows Subsystem for Linux is
# not installed" and exits 0 on that image, so the step looked like it worked
# while the popup it was meant to stop kept appearing every 30 seconds. Four
# workflows carried that silently. One definition cannot drift like that.

inputs:
  python-version:
    description: Python to install. Set to an empty string to skip setup-python.
    required: false
    default: "3.13"
  wintegrate-version:
    description: >
      Version specifier for wintegrate, e.g. ">=0.5.5". The video extra is always
      included, since a runner nobody is watching is the reason to record.

      Keep the floor at >=0.5.5 or above: that is where the recorder started
      drawing the cursor, click markers and keycaps into the frames itself. On
      anything older the recording shows an application changing with nothing to
      say what was sent, and no step here supplies that any more.
    required: false
    default: ">=0.5.5"

runs:
  using: composite
  steps:
    # Things on the arm64 image take the foreground away from whatever is being
    # driven, and they do it *after* the run has started: the provisioning daemon
    # spawns a terminal popup every 30 seconds until WSL is there, and Edge's
    # first-run page appears the first time anything launches a URL.
    #
    - name: Stop Windows from putting hard errors on the desktop, and measure why it might
      shell: pwsh
      run: |
        # ErrorMode=2 suppresses hard-error message boxes for the whole system.
        # A runner has nobody to click them, so one sits modal on the desktop and
        # takes the foreground -- measured on windows-11-arm, which twice raised
        # "Windows created a temporary paging file on your computer because of a
        # problem that occurred with your paging file configuration" and then
        # produced no window at all for notepad.exe.
        #
        # The whole class, rather than that one title: any hard error is a modal
        # nobody will answer.
        $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Windows'
        $was = (Get-ItemProperty -Path $key -Name ErrorMode -ErrorAction SilentlyContinue).ErrorMode
        Set-ItemProperty -Path $key -Name ErrorMode -Value 2
        Write-Host "ErrorMode: $was -> $((Get-ItemProperty -Path $key -Name ErrorMode).ErrorMode)"

        # Measured, not fixed. The paging-file warning means the machine is
        # already short of something, and none of it can be repaired from inside
        # the job: automatic pagefile management needs a reboot to take effect,
        # and if the disk is what ran out then managing it differently does not
        # make room. What this can do is make the next failure attributable
        # instead of arriving as "no window appeared".
        Get-PSDrive C | Select-Object @{n='Free(GB)';e={[math]::Round($_.Free/1GB,1)}},
                                      @{n='Used(GB)';e={[math]::Round($_.Used/1GB,1)}} |
          Format-Table -AutoSize | Out-String | Write-Host
        $cs = Get-CimInstance Win32_ComputerSystem
        Write-Host "AutomaticManagedPagefile: $($cs.AutomaticManagedPagefile)"
        Get-CimInstance Win32_PageFileUsage |
          Select-Object Name, CurrentUsage, AllocatedBaseSize, PeakUsage |
          Format-Table -AutoSize | Out-String | Write-Host

        # One may already be up: ErrorMode only governs the next hard error, and
        # this one is raised at logon, before any step runs.
        #
        # By window handle, not Get-Process | Where MainWindowTitle. A modal
        # #32770 is not necessarily its process's main window -- if it belongs to
        # explorer the title never matches, and if it did, Stop-Process would
        # take the desktop with it.
        # A here-string cannot be used here: PowerShell wants its terminator in
        # column 0, and that ends the YAML block before the step does.
        $sig = @(
          '[DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr p);'
          'public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr p);'
          '[DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);'
          '[DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);'
          '[DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);'
          '[DllImport("user32.dll")] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, IntPtr w, IntPtr l, uint f, uint t, out IntPtr r);'
        ) -join [Environment]::NewLine
        Add-Type -Namespace Win -Name Dlg -MemberDefinition $sig

        $found = @()
        $cb = [Win.Dlg+EnumWindowsProc]{
          param($hWnd, $lParam)
          if ([Win.Dlg]::IsWindowVisible($hWnd)) {
            $cls = New-Object System.Text.StringBuilder 256
            [void][Win.Dlg]::GetClassName($hWnd, $cls, 256)
            $txt = New-Object System.Text.StringBuilder 512
            [void][Win.Dlg]::GetWindowText($hWnd, $txt, 512)
            # Class and title together. This runs on a live desktop, and closing
            # a dialog the tests put up would be worse than the noise.
            if ($cls.ToString() -eq '#32770' -and $txt.ToString() -match 'System Properties') {
              $script:found += $txt.ToString()
              # WM_CLOSE with a timeout, because a modal dialog runs its own
              # message loop and a plain PostMessage can go unanswered.
              $r = [IntPtr]::Zero
              [void][Win.Dlg]::SendMessageTimeout($hWnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero, 2, 3000, [ref]$r)
            }
          }
          return $true
        }
        [void][Win.Dlg]::EnumWindows($cb, [IntPtr]::Zero)
        if ($found.Count -gt 0) {
          Write-Host "::warning::Dismissed runner dialog(s): $($found -join ', '). Windows only says this when the machine is already short of something, so treat a failure in this job as environmental until shown otherwise."
        } else {
          Write-Host "No runner dialog on the desktop."
        }
        }

    # A test that loses the foreground does not fail with "the foreground was
    # taken" — it fails with an empty field, a keystroke that went nowhere, or a
    # window that never came up.
    - name: Quiet the arm64 image
      if: runner.arch == 'ARM64'
      shell: pwsh
      run: |
        $p = Start-Process -FilePath wsl.exe -ArgumentList '--update', '--confirm' `
          -NoNewWindow -PassThru
        if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host 'wsl --update timed out' }

        # `wsl --status` writes UTF-16; through a pipe the interleaved NULs make
        # the string match nothing, so the encoding is set for the call.
        function Get-WslStatus {
          $prev = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
            return ((& wsl.exe --status 2>&1 | Out-String) -replace "\0", '')
          } finally { [Console]::OutputEncoding = $prev }
        }
        $status = Get-WslStatus
        Write-Host "WSL status: $status"

        # The part that is easy to leave out, and was: `wsl --update` alone is a
        # no-op here and exits 0. There is nothing to update until WSL exists.
        if ($status -match 'not installed') {
          try {
            $rel = Invoke-RestMethod 'https://api.github.com/repos/microsoft/WSL/releases/latest'
            $asset = $rel.assets | Where-Object { $_.name -match 'arm64\.msi$' } | Select-Object -First 1
            if ($asset) {
              Write-Host "Downloading $($asset.name)..."
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile wsl-arm64.msi
              Start-Process msiexec -ArgumentList '/i', 'wsl-arm64.msi', '/qn', '/norestart' -Wait
              Write-Host "WSL status after install: $(Get-WslStatus)"
            }
          } catch {
            Write-Host "WSL MSI fallback skipped: $_"
          }
        }

        # Edge's first-run page, in both hives.
        foreach ($hive in 'HKLM', 'HKCU') {
          $key = "${hive}:\SOFTWARE\Policies\Microsoft\Edge"
          New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $key -Name 'HideFirstRunExperience' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $key -Name 'PreventFirstRunPage' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        }
        # The OOBE privacy experience is a different dialog from Edge's.
        $oobe = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
        New-Item -Path $oobe -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path $oobe -Name 'DisablePrivacyExperience' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

        Get-Process -Name 'wsl','wslhost','WindowsTerminal','msedge','msedgewebview2' `
          -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        # wsl.exe exits non-zero when WSL is absent, and this step is best-effort.
        $global:LASTEXITCODE = 0

    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install wintegrate
      shell: pwsh
      run: pip install "wintegrate[video]${{ inputs.wintegrate-version }}" pytest

    # A first-run popup owning the foreground is not something the test can
    # recover from politely, and on these images it is usually a CoreWindow
    # ("Microsoft account", "Search") rather than anything the test launched.
    - name: Close anything holding the foreground
      shell: pwsh
      run: |
        python -c "
        import time
        from wintegrate.interop import (
            get_foreground_window, get_window_class, get_window_title, user32,
        )
        WM_CLOSE = 0x0010
        for attempt in range(2):
            hwnd = get_foreground_window()
            if not hwnd:
                continue
            cls, title = get_window_class(hwnd), get_window_title(hwnd)
            print(f'pass {attempt}: foreground is class={cls!r} title={title!r}')
            if cls == 'Windows.UI.Core.CoreWindow':
                user32.SendMessageW(hwnd, WM_CLOSE, 0, 0)
                print('  sent WM_CLOSE')
                time.sleep(3)
        hwnd = get_foreground_window()
        print(f'foreground now: {get_window_class(hwnd)!r} {get_window_title(hwnd)!r}')
        "


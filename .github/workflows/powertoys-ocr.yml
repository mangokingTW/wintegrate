# Dedicated CI Automation for PowerToys Text Extractor (PowerOCR WinUI 3)
#
# Validates that wintegrate drives PowerToys Text Extractor deterministically
# on GitHub-Hosted Windows runners (windows-latest) without WinAppDriver or detached desktop issues:
# - Fullscreen topmost overlay activation (WindowEx) and Escape dismissal
# - Toolbar toggle modes (SingleLine, Table) and accessibility names
# - Region selection via smooth interpolated mouse pointer drag (PointerMoved on XAML DIPs)
# - Failure video recordings and window census diff diagnostics

name: PowerToys PowerOCR CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: "Runner architecture"
        type: choice
        options: [x64, arm64, both]
        default: x64

permissions:
  contents: read

jobs:
  test-powertoys-ocr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Download and Install PowerToys (x64)
        shell: powershell
        run: |
          Write-Host "Downloading PowerToys installer..."
          $url = "https://github.com/microsoft/PowerToys/releases/download/v0.101.2362.0/PowerToysUserSetup-0.101.2362.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "PowerToysSetup.exe"
          Write-Host "Installing PowerToys silently..."
          $proc = Start-Process -FilePath ".\PowerToysSetup.exe" -ArgumentList "/install /quiet /norestart" -PassThru -Wait
          Write-Host "Installer finished with exit code: $($proc.ExitCode)"

      - name: Run PowerToys PowerOCR Automation Tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          WINTEGRATE_RECORD: "1"
        run: |
          pytest tests/test_powertoys_ocr_unit.py tests/test_target_powertoys_ocr.py -v --tb=short

      - name: Upload Test Video and Diagnostic Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: powertoys-ocr-test-artifacts
          path: |
            .wintegrate/
            test_artifacts/
          if-no-files-found: ignore

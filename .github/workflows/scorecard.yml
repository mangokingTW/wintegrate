name: Scorecard

# OpenSSF Scorecard grades the project's security posture -- branch protection,
# pinned actions, whether releases carry provenance, leaked-secret checks -- and
# publishes the result. An impartial third party reporting on how the repository
# is run, not on the code itself.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * 2"
  # Manual refresh: the score is otherwise only re-evaluated on a push to main or
  # the weekly cron, so a release (a tag push) does not update Signed-Releases on
  # its own.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the result to the Security tab, and publish it to the public
      # Scorecard API that backs the README badge.
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

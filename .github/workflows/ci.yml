name: CI UI Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/ tests/

  test-x64:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-x64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  test-arm64:
    needs: lint
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions setup-python provides official Windows ARM64 builds for Python 3.11+
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Windows ARM64
        shell: pwsh
        run: |
          Write-Host "Installing FFmpeg on Windows ARM64 via winget/choco..."
          winget install --id Gyan.FFmpeg --accept-package-agreements --accept-source-agreements --silent || choco install ffmpeg -y || Write-Host "Package manager installation completed."
          $ffmpegPaths = @(
            "C:\ProgramData\chocolatey\bin\ffmpeg.exe",
            "C:\Program Files\FFmpeg\bin\ffmpeg.exe",
            "C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-*\bin\ffmpeg.exe"
          )
          foreach ($p in $ffmpegPaths) {
            $matched = Get-Item $p -ErrorAction SilentlyContinue
            if ($matched) {
              $dir = $matched.Directory.FullName
              Write-Host "Adding FFmpeg directory to PATH: $dir"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              break
            }
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-arm64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

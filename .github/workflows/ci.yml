name: CI UI Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/ tests/

  test-x64:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-x64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

      - name: Append Recording Summary to Step Summary
        if: always()
        shell: pwsh
        run: |
          $summary = "### 🎥 Video & Action Recording Summary (x64 - Python ${{ matrix.python-version }})`n`n"
          if (Test-Path "recording-artifacts/session_recording.mp4") {
            $size = (Get-Item "recording-artifacts/session_recording.mp4").Length / 1KB
            $summary += "- ✅ **Video Recording**: `session_recording.mp4` (${size:N1} KB)`n"
          } else {
            $summary += "- ⚠️ **Video Recording**: No MP4 produced (FFmpeg unavailable on runner)`n"
          }
          if (Test-Path "recording-artifacts/timeline.log") {
            $summary += "- 📝 **Action Timeline**: `timeline.log``n"
          }
          if (Test-Path "recording-artifacts/window_census.json") {
            $summary += "- 🪟 **Window Census**: `window_census.json``n"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  test-arm64:
    needs: lint
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions setup-python provides official Windows ARM64 builds for Python 3.11+
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-arm64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

      - name: Append Recording Summary to Step Summary
        if: always()
        shell: pwsh
        run: |
          $summary = "### 🎥 Video & Action Recording Summary (ARM64 - Python ${{ matrix.python-version }})`n`n"
          if (Test-Path "recording-artifacts/session_recording.mp4") {
            $size = (Get-Item "recording-artifacts/session_recording.mp4").Length / 1KB
            $summary += "- ✅ **Video Recording**: `session_recording.mp4` (${size:N1} KB)`n"
          } else {
            $summary += "- ⚠️ **Video Recording**: No MP4 produced (FFmpeg unavailable on runner)`n"
          }
          if (Test-Path "recording-artifacts/timeline.log") {
            $summary += "- 📝 **Action Timeline**: `timeline.log``n"
          }
          if (Test-Path "recording-artifacts/window_census.json") {
            $summary += "- 🪟 **Window Census**: `window_census.json``n"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

name: CI UI Automation Tests

on:
  push:
    branches: [ main ]
  # Every pull request, not just those targeting main: a stacked PR based on
  # another feature branch would otherwise get no CI at all, and could only be
  # verified after its base was merged.
  pull_request:

# The workflow only reads the repository; nothing here needs a writable token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          # Hash-pinned: a compromised or yanked release of the linter cannot
          # silently enter the build.
          python -m pip install --require-hashes -r .github/requirements/lint.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test-x64:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        # Records the whole run to one video, not just the per-session clips: the
        # dialog that breaks a late test usually appeared during an early one.
        env:
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          # Tee'd and then searched for a native crash, because pytest's exit
          # code does not report one. 0.5.9 shipped an access violation inside
          # the touch delivery check: faulthandler printed the dump, execution
          # carried on, the two tests it broke reported themselves as *skipped*,
          # and the summary line read "15 passed, 2 skipped". The run looked
          # clean. Nothing about a crash reaches the exit code, so the log is
          # the only place it exists -- and an unread log is not a check.
          pytest tests/ -v -s -m "not target_app" 2>&1 | Tee-Object -FilePath pytest-output.txt
          $failed = $LASTEXITCODE
          $crashes = Select-String -Path pytest-output.txt -Pattern 'Windows fatal exception|access violation' -SimpleMatch:$false
          if ($crashes) {
            Write-Host "::error::a native crash happened during the tests, which pytest reports as neither a failure nor an error"
            $crashes | Select-Object -First 8 | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            exit 1
          }
          if ($failed -ne 0) { exit $failed }

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-x64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  test-arm64:
    needs: lint
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions setup-python provides official Windows ARM64 builds for Python 3.11+
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install WSL on ARM Runner (Stop 30s probe popups)
        shell: pwsh
        run: |
          # 1. Update WSL stub so the provision daemon stops spawning terminal popups every 30s
          $p = Start-Process -FilePath wsl.exe -ArgumentList '--update', '--confirm' -NoNewWindow -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host 'wsl --update timed out' }

          # 2. Fallback to arm64 MSI if needed
          function Get-WslStatus {
            $prev = [Console]::OutputEncoding
            try {
              [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
              return ((& wsl.exe --status 2>&1 | Out-String) -replace "\0", '')
            } finally { [Console]::OutputEncoding = $prev }
          }
          $status = Get-WslStatus
          Write-Host "WSL status: $status"
          if ($status -match 'not installed') {
            try {
              $rel = Invoke-RestMethod 'https://api.github.com/repos/microsoft/WSL/releases/latest'
              $asset = $rel.assets | Where-Object { $_.name -match 'arm64\.msi$' } | Select-Object -First 1
              if ($asset) {
                Write-Host "Downloading $($asset.name)..."
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile wsl-arm64.msi
                Start-Process msiexec -ArgumentList '/i', 'wsl-arm64.msi', '/qn', '/norestart' -Wait
              }
            } catch {
              Write-Host "WSL MSI fallback skipped: $_"
            }
          }

          # 3. Disable Microsoft Edge First Run Experience via Registry
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "PreventFirstRunPage" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

          # 4. Sweep existing background popups
          Get-Process -Name "wsl","wslhost","msedge","msedgewebview2" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # WindowsTerminal is hidden, not killed. On Windows 11 it is also the default
          # console host, so Stop-Process ends every console it hosts -- this step's
          # included, and on a hosted runner the agent reporting the job with it. What
          # steals the foreground is its window; hiding that leaves the process alone.
          $u32 = Add-Type -Namespace Quiet -Name User32 -PassThru -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);'
          Get-Process -Name 'WindowsTerminal' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object { [void]$u32::ShowWindow($_.MainWindowHandle, 0) }
          $global:LASTEXITCODE = 0

      # Python 3.12+ ships pre-installed in the windows-11-arm image's tool cache,
      # but 3.11 does not: setup-python downloads and installs it on every run
      # (~90s). Cache the installed toolchain so later runs restore it instead.
      - name: Cache Python ${{ matrix.python-version }} toolchain
        if: matrix.python-version == '3.11'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\Python\3.11*
          key: python-toolchain-winarm64-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        # Records the whole run to one video, not just the per-session clips: the
        # dialog that breaks a late test usually appeared during an early one.
        env:
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          # Tee'd and then searched for a native crash, because pytest's exit
          # code does not report one. 0.5.9 shipped an access violation inside
          # the touch delivery check: faulthandler printed the dump, execution
          # carried on, the two tests it broke reported themselves as *skipped*,
          # and the summary line read "15 passed, 2 skipped". The run looked
          # clean. Nothing about a crash reaches the exit code, so the log is
          # the only place it exists -- and an unread log is not a check.
          pytest tests/ -v -s -m "not target_app" 2>&1 | Tee-Object -FilePath pytest-output.txt
          $failed = $LASTEXITCODE
          $crashes = Select-String -Path pytest-output.txt -Pattern 'Windows fatal exception|access violation' -SimpleMatch:$false
          if ($crashes) {
            Write-Host "::error::a native crash happened during the tests, which pytest reports as neither a failure nor an error"
            $crashes | Select-Object -First 8 | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            exit 1
          }
          if ($failed -ne 0) { exit $failed }

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-arm64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  # Four third-party applications, one per generation of Windows UI technology.
  # A test app written for this library only proves the library agrees with
  # itself; these prove it against software that has never heard of it.
  #
  # One runner per application, in parallel. Not pytest-xdist: these drive the
  # real desktop, so two of them on one machine would fight over foreground focus
  # and produce failures that belong to neither test. Separate runners also mean
  # each job installs only what it needs, and a red job names the application
  # without anyone reading the log.
  test-target-app:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is Windows Server 2025; windows-11-arm is Windows 11
          # Enterprise. Both, because a client SKU and a server SKU are not
          # interchangeable for UI automation — this suite already carries
          # desktop_only and server_only markers for that reason.
          #
          # Every application is installed from its own official installer,
          # addressed by a URL that pins the version and the architecture
          # together. Chocolatey was used first and removed: its community feed
          # answered 'Unable to connect to source' from the runners, which took
          # out two jobs, and it ships the x64 build on both architectures for
          # applications whose arm64 build behaves differently.
          - app: notepad++
            os: windows-latest
            arch: x64
            tests: tests/test_scintilla.py
            require: Notepad++
            fixtureTag: notepadpp-8.9.8
            fixtureAsset: npp.8.9.8.Installer.x64.exe
            fixtureSha256: '7b2a949bf460fb37a3888c9048698f43222a185a48323023df1c51e78a3ca1c2'
            fixtureSigner: 'E=don.h@free.fr, CN="NOTEPAD++", O="NOTEPAD++", L=Paris, S=Île-de-France, C=FR'
            installerArgs: '/S'
            installerExpects: 'C:\\Program Files\\Notepad++\\notepad++.exe'
          - app: notepad++
            os: windows-11-arm
            arch: arm64
            tests: tests/test_scintilla.py
            require: Notepad++
            fixtureTag: notepadpp-8.9.8
            fixtureAsset: npp.8.9.8.Installer.arm64.exe
            fixtureSha256: '3ac2c91245e980c4fd0991e5c1971439e234c0713e994d1dae532c70b7528587'
            fixtureSigner: 'E=don.h@free.fr, CN="NOTEPAD++", O="NOTEPAD++", L=Paris, S=Île-de-France, C=FR'
            installerArgs: '/S'
            installerExpects: 'C:\\Program Files\\Notepad++\\notepad++.exe'
          - app: winmerge
            os: windows-latest
            arch: x64
            tests: tests/test_target_winmerge.py
            require: WinMerge
            fixtureTag: winmerge-2.16.58.2
            fixtureAsset: WinMerge-2.16.58.2-x64-Setup.exe
            fixtureSha256: '26f794838bc4e545d7b9f36dc8beeb5a65a12bd4627fa3b4fe87068abef925b0'
            fixtureSigner: 'CN=Takashi Sawanaka, O=Takashi Sawanaka, L=Chiba, S=Chiba, C=JP'
            installerArgs: '/VERYSILENT /SUPPRESSMSGBOXES /SP- /NORESTART'
            installerExpects: 'C:\\Program Files\\WinMerge\\WinMergeU.exe'
          - app: winmerge
            os: windows-11-arm
            arch: arm64
            tests: tests/test_target_winmerge.py
            require: WinMerge
            fixtureTag: winmerge-2.16.58.2
            fixtureAsset: WinMerge-2.16.58.2-ARM64-Setup.exe
            fixtureSha256: '3dcd40d79fee3f01da7e12765d5dc3f4cbec8e038749b791697b573ba1d3a8ce'
            fixtureSigner: 'CN=Takashi Sawanaka, O=Takashi Sawanaka, L=Chiba, S=Chiba, C=JP'
            installerArgs: '/VERYSILENT /SUPPRESSMSGBOXES /SP- /NORESTART'
            installerExpects: 'C:\\Program Files\\WinMerge\\WinMergeU.exe'
          # DB Browser for SQLite v3.13.1 ships a different Qt per
          # architecture: the win64 msi carries Qt5Core.dll and the arm64
          # msi carries Qt6Core.dll. Same application version, different
          # accessibility surface — Qt 6 exposes SelectionItem on tab items
          # and Qt 5 does not — so running only one would leave half the
          # users untested.
          #
          # The arm64 msi carries no Authenticode signature at all upstream, so
          # its fixtureSigner is empty and the hash is the only check there is.
          # Pinning a signer it does not have would fail every run; pretending
          # the other three are equally verified would be worse.
          - app: sqlitebrowser
            os: windows-latest
            arch: x64
            tests: tests/test_target_sqlitebrowser.py
            require: DB Browser for SQLite
            fixtureTag: sqlitebrowser-3.13.1
            fixtureAsset: DB.Browser.for.SQLite-v3.13.1-win64.msi
            fixtureSha256: 'd023d54b3a5db10c7e896089bb3dbe6e7f4bc4eaa9bbecb34ca414be5970f688'
            fixtureSigner: 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US'
            installerArgs: ''
            installerExpects: ''
          - app: sqlitebrowser
            os: windows-11-arm
            arch: arm64
            tests: tests/test_target_sqlitebrowser.py
            require: DB Browser for SQLite
            fixtureTag: sqlitebrowser-3.13.1
            fixtureAsset: DB.Browser.for.SQLite-v3.13.1-arm64.msi
            fixtureSha256: '89bf0adafad492f44d850d76c188204f0639f185b50482a3cbd59afe509b1d84'
            fixtureSigner: ''
            installerArgs: ''
            installerExpects: ''
          - app: files
            os: windows-latest
            arch: x64
            tests: tests/test_target_files.py
            require: Files
            fixtureTag: files-4.2.9.0
            fixtureAsset: Files.Package_4.2.9.0_x64_arm64.msixbundle
            fixtureSha256: '87bd06f897094fce4d14ec0d87f258c711477c6f1c5271b055c794b3aac7ff41'
            fixtureSigner: 'CN=Yair Aichenbaum, O=Yair Aichenbaum, L=Baltimore, S=Maryland, C=US'
            installerArgs: ''
            installerExpects: ''
          - app: files
            os: windows-11-arm
            arch: arm64
            tests: tests/test_target_files.py
            require: Files
            fixtureTag: files-4.2.9.0
            fixtureAsset: Files.Package_4.2.9.0_x64_arm64.msixbundle
            fixtureSha256: '87bd06f897094fce4d14ec0d87f258c711477c6f1c5271b055c794b3aac7ff41'
            fixtureSigner: 'CN=Yair Aichenbaum, O=Yair Aichenbaum, L=Baltimore, S=Maryland, C=US'
            installerArgs: ''
            installerExpects: ''
    name: test-target-app (${{ matrix.app }} / ${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install WSL on ARM Runner (Stop 30s probe popups)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # 1. Update WSL stub so the provision daemon stops spawning terminal popups every 30s
          $p = Start-Process -FilePath wsl.exe -ArgumentList '--update', '--confirm' -NoNewWindow -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host 'wsl --update timed out' }

          # 2. Fallback to arm64 MSI if needed
          function Get-WslStatus {
            $prev = [Console]::OutputEncoding
            try {
              [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
              return ((& wsl.exe --status 2>&1 | Out-String) -replace "\0", '')
            } finally { [Console]::OutputEncoding = $prev }
          }
          $status = Get-WslStatus
          Write-Host "WSL status: $status"
          if ($status -match 'not installed') {
            try {
              $rel = Invoke-RestMethod 'https://api.github.com/repos/microsoft/WSL/releases/latest'
              $asset = $rel.assets | Where-Object { $_.name -match 'arm64\.msi$' } | Select-Object -First 1
              if ($asset) {
                Write-Host "Downloading $($asset.name)..."
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile wsl-arm64.msi
                Start-Process msiexec -ArgumentList '/i', 'wsl-arm64.msi', '/qn', '/norestart' -Wait
              }
            } catch {
              Write-Host "WSL MSI fallback skipped: $_"
            }
          }

          # 3. Disable Microsoft Edge First Run Experience via Registry
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "PreventFirstRunPage" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

          # 4. Sweep existing background popups
          Get-Process -Name "wsl","wslhost","msedge","msedgewebview2" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # WindowsTerminal is hidden, not killed. On Windows 11 it is also the default
          # console host, so Stop-Process ends every console it hosts -- this step's
          # included, and on a hosted runner the agent reporting the job with it. What
          # steals the foreground is its window; hiding that leaves the process alone.
          $u32 = Add-Type -Namespace Quiet -Name User32 -PassThru -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);'
          Get-Process -Name 'WindowsTerminal' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object { [void]$u32::ShowWindow($_.MainWindowHandle, 0) }
          $global:LASTEXITCODE = 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The arm64 image comes up with a 'Microsoft account' window holding the
      # foreground, and it stays there. Every keystroke a test sends goes to it
      # instead of to the application, which looks like a broken editor: length 0,
      # get_value() empty, Ctrl+F opening no dialog — and every element still
      # resolving, so nothing in the failure points at a window in front.
      #
      # Found because the Notepad++ fixture now names whatever holds the
      # foreground. Closed here so it does not have to.
      #
      # Written with the library rather than with inline P/Invoke: it is already
      # installed by the step above, and this is the kind of thing it is for.
      - name: Close the shell prompts that hold the foreground
        run: |
          python -c "
          import time
          from wintegrate.interop import (
              get_foreground_window, get_window_class, get_window_title, user32,
          )
          WM_CLOSE = 0x0010
          for attempt in range(2):
              hwnd = get_foreground_window()
              if not hwnd:
                  continue
              cls, title = get_window_class(hwnd), get_window_title(hwnd)
              print(f'pass {attempt}: foreground is class={cls!r} title={title!r}')
              if cls == 'Windows.UI.Core.CoreWindow':
                  user32.SendMessageW(hwnd, WM_CLOSE, 0, 0)
                  print('  sent WM_CLOSE')
                  time.sleep(3)
          hwnd = get_foreground_window()
          print(f'foreground now: {get_window_class(hwnd)!r} {get_window_title(hwnd)!r}')
          "

      # Every target application is fetched from the fixture mirror rather than
      # from its own publisher, and this one step does it for all four.
      #
      # Mirroring started with Files, which had no choice: its GitHub releases
      # carry zero assets, so the package exists only on the CDN named in the
      # project's own cd-sideload-stable.yml, and that CDN is behind Cloudflare
      # bot protection — a runner's datacentre IP gets a "Just a moment..."
      # challenge page instead of the 100 MB bundle. The rest followed for a
      # duller reason: a release gate that reaches out to four separate
      # third-party hosts on every push fails whenever any one of them is having
      # a bad day, and none of those failures says anything about this library.
      #
      # Mirrored bytes are verified, not trusted:
      #
      #   sha256  pins the exact bytes. Each hash was produced twice, from two
      #           independent downloads of the upstream asset, and they agreed.
      #   signer  pins the publisher's Authenticode subject, so the bytes stay
      #           attributable even though they now come from this account.
      #
      # fixtureSigner is empty for assets upstream does not sign at all — the DB
      # Browser arm64 msi, and any zip. There the hash is the only check there
      # is, and pinning a signature that does not exist would fail every run.
      - name: Fetch ${{ matrix.app }} from the fixture mirror
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_TAG: ${{ matrix.fixtureTag }}
          FIXTURE_ASSET: ${{ matrix.fixtureAsset }}
          FIXTURE_SHA256: ${{ matrix.fixtureSha256 }}
          FIXTURE_SIGNER: ${{ matrix.fixtureSigner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'fixture'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          gh release download $env:FIXTURE_TAG `
            --repo mangokingTW/wintegrate-test-fixtures `
            --pattern $env:FIXTURE_ASSET --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }

          $path = Join-Path $dir $env:FIXTURE_ASSET
          if (-not (Test-Path $path)) { throw "$env:FIXTURE_ASSET is not in $dir" }
          Write-Host ("downloaded {0:N1} MB: {1}" -f ((Get-Item $path).Length / 1MB), $env:FIXTURE_ASSET)

          $hash = (Get-FileHash $path -Algorithm SHA256).Hash
          if ($hash -ne $env:FIXTURE_SHA256.ToUpperInvariant()) {
            throw "SHA-256 mismatch for $($env:FIXTURE_ASSET): got $hash, expected $($env:FIXTURE_SHA256)"
          }
          Write-Host "sha256 ok: $hash"

          if ($env:FIXTURE_SIGNER) {
            $sig = Get-AuthenticodeSignature $path
            Write-Host "signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status), not Valid" }
            # Compared whole rather than by prefix: a prefix match on
            # 'CN=Some Publisher' also accepts 'CN=Some Publisher Ltd'.
            #
            # Subjects are not ASCII — Notepad++'s carries 'S=Île-de-France'.
            # The first version of this pinned 'Ile-de-France', because the
            # console that captured the subject had mangled the accent, and the
            # mismatch only showed up here. Copy these from a runner's own log.
            if ($sig.SignerCertificate.Subject -ne $env:FIXTURE_SIGNER) {
              throw "unexpected signer: $($sig.SignerCertificate.Subject)"
            }
          } else {
            Write-Host "no signer pinned: upstream ships this asset unsigned, so the hash is the only check"
          }

          "FIXTURE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The result is verified here rather than left to the tests. An install that
      # fails quietly surfaces six seconds later as "Notepad++ not available: not
      # found at any of:" from a test, which points at the wrong thing — that is
      # what happened when Chocolatey's feed went unreachable and this step reset
      # $LASTEXITCODE to hide it.
      - name: Install ${{ matrix.app }} (${{ matrix.arch }})
        if: matrix.installerArgs != ''
        # An installer waiting on a dialog nobody will click would otherwise hold
        # the job open for hours. The arm64 WinMerge setup did exactly that with
        # /SILENT, which shows a progress window; /VERYSILENT does not.
        timeout-minutes: 10
        shell: pwsh
        env:
          INSTALLER_ARGS: ${{ matrix.installerArgs }}
          INSTALLER_EXPECTS: ${{ matrix.installerExpects }}
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath $env:FIXTURE -Wait -PassThru `
            -ArgumentList ($env:INSTALLER_ARGS -split ' ')
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

          if (-not (Test-Path $env:INSTALLER_EXPECTS)) {
            throw "installer reported success but $($env:INSTALLER_EXPECTS) does not exist"
          }
          Write-Host ("installed: {0}" -f (Get-Item $env:INSTALLER_EXPECTS).VersionInfo.FileVersion)

      # The msi is used rather than the Chocolatey package, which wraps the win64
      # build on both architectures — and covering the two Qt versions is the
      # whole reason this app runs twice.
      - name: Install DB Browser for SQLite (${{ matrix.arch }})
        if: matrix.app == 'sqlitebrowser'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath msiexec.exe -Wait -PassThru `
            -ArgumentList @('/i', "`"$env:FIXTURE`"", '/qn', '/norestart')
          if ($p.ExitCode -ne 0) { throw "msiexec exited $($p.ExitCode)" }
          $dirs = @(
            'C:\Program Files\DB Browser for SQLite',
            'C:\Program Files (x86)\DB Browser for SQLite'
          )
          $dir = $dirs | Where-Object { Test-Path (Join-Path $_ 'DB Browser for SQLite.exe') } | Select-Object -First 1
          if (-not $dir) { throw "not installed at any of: $($dirs -join ', ')" }
          $exe = Join-Path $dir 'DB Browser for SQLite.exe'
          $qt = if (Test-Path (Join-Path $dir 'Qt6Core.dll')) { 'Qt6' }
                elseif (Test-Path (Join-Path $dir 'Qt5Core.dll')) { 'Qt5' }
                else { 'unknown Qt' }
          Write-Host ("installed: {0} ({1}) at {2}" -f (Get-Item $exe).VersionInfo.FileVersion, $qt, $dir)

      - name: Install Files
        if: matrix.app == 'files'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Files 4.x is framework-dependent; without a Windows Desktop runtime it
          # starts and shows a #32770 message box owned by Files.exe instead of a
          # window, and discovery by process name accepts that dialog as the app.
          #
          # The runner images already carry Microsoft.WindowsDesktop.App — 8.x,
          # 9.x and 10.x were all present before this step ever ran — so the
          # install is normally redundant, and it cost 66s of a 163s job. It is
          # kept as a fallback rather than deleted: if an image ever ships
          # without it, the symptom is a message box that discovery mistakes for
          # the application, which is a poor thing to debug from a log.
          $have = & "$env:ProgramFiles\dotnet\dotnet.exe" --list-runtimes |
            Select-String -Pattern 'Microsoft\.WindowsDesktop\.App 10\.'
          if ($have) {
            Write-Host "Windows Desktop runtime already present, skipping the install:"
            $have | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "no Microsoft.WindowsDesktop.App 10.x on this image; installing"
            choco install dotnet-desktopruntime -y --no-progress
            $global:LASTEXITCODE = 0
            & "$env:ProgramFiles\dotnet\dotnet.exe" --list-runtimes
          }

          # No -DependencyPath. The .appinstaller lists VCLibs, but Files' own
          # manifest depends only on Microsoft.WindowsAppRuntime.2 — and handing
          # Add-AppxPackage a package the manifest does not reference fails the
          # whole install with 0x80073CF3.
          try {
            Add-AppxPackage -Path $env:FIXTURE -ForceApplicationShutdown -ErrorAction Stop
          } catch {
            # 0x80070005 here is usually not a permission problem: MSIX deployment
            # needs the Process Lifetime Manager, which a non-interactive session
            # cannot reach. The deployment log says so and the exception does not.
            Write-Host "::error::Add-AppxPackage failed: $($_.Exception.Message)"
            Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 25 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("[{0}] id={1} {2}" -f $_.TimeCreated.ToString('HH:mm:ss'), $_.Id, ($_.Message -replace "`r?`n", ' ')) }
            throw
          }
          Get-AppxPackage -Name 'Files' | ForEach-Object { Write-Host "installed: $($_.PackageFullName)" }

      - name: Run ${{ matrix.app }} tests
        env:
          # Turns "the application is not installed" from a skip into a failure.
          # Without it a broken install step would leave a green job that tested
          # nothing, which is the exact failure mode this job exists to catch.
          WINTEGRATE_REQUIRE_TARGET_APPS: ${{ matrix.require }}
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          pytest ${{ matrix.tests }} -v -s -m target_app

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-target-app-${{ matrix.app }}-${{ matrix.arch }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

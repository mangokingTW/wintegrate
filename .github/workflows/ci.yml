name: CI UI Automation Tests

on:
  push:
    branches: [ main ]
  # Every pull request, not just those targeting main: a stacked PR based on
  # another feature branch would otherwise get no CI at all, and could only be
  # verified after its base was merged.
  pull_request:

# The workflow only reads the repository; nothing here needs a writable token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          # Hash-pinned: a compromised or yanked release of the linter cannot
          # silently enter the build.
          python -m pip install --require-hashes -r .github/requirements/lint.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test-x64:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        # Records the whole run to one video, not just the per-session clips: the
        # dialog that breaks a late test usually appeared during an early one.
        env:
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          pytest tests/ -v -s -m "not target_app"

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-x64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  test-arm64:
    needs: lint
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions setup-python provides official Windows ARM64 builds for Python 3.11+
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install WSL on ARM Runner (Stop 30s probe popups)
        shell: pwsh
        run: |
          # 1. Update WSL stub so the provision daemon stops spawning terminal popups every 30s
          $p = Start-Process -FilePath wsl.exe -ArgumentList '--update', '--confirm' -NoNewWindow -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host 'wsl --update timed out' }

          # 2. Fallback to arm64 MSI if needed
          function Get-WslStatus {
            $prev = [Console]::OutputEncoding
            try {
              [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
              return ((& wsl.exe --status 2>&1 | Out-String) -replace "\0", '')
            } finally { [Console]::OutputEncoding = $prev }
          }
          $status = Get-WslStatus
          Write-Host "WSL status: $status"
          if ($status -match 'not installed') {
            try {
              $rel = Invoke-RestMethod 'https://api.github.com/repos/microsoft/WSL/releases/latest'
              $asset = $rel.assets | Where-Object { $_.name -match 'arm64\.msi$' } | Select-Object -First 1
              if ($asset) {
                Write-Host "Downloading $($asset.name)..."
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile wsl-arm64.msi
                Start-Process msiexec -ArgumentList '/i', 'wsl-arm64.msi', '/qn', '/norestart' -Wait
              }
            } catch {
              Write-Host "WSL MSI fallback skipped: $_"
            }
          }

          # 3. Disable Microsoft Edge First Run Experience via Registry
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "PreventFirstRunPage" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

          # 4. Sweep existing background popups
          Get-Process -Name "wsl","wslhost","WindowsTerminal","msedge","msedgewebview2" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      # Python 3.12+ ships pre-installed in the windows-11-arm image's tool cache,
      # but 3.11 does not: setup-python downloads and installs it on every run
      # (~90s). Cache the installed toolchain so later runs restore it instead.
      - name: Cache Python ${{ matrix.python-version }} toolchain
        if: matrix.python-version == '3.11'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\Python\3.11*
          key: python-toolchain-winarm64-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        # Records the whole run to one video, not just the per-session clips: the
        # dialog that breaks a late test usually appeared during an early one.
        env:
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          pytest tests/ -v -s -m "not target_app"

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-arm64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  # Four third-party applications, one per generation of Windows UI technology.
  # A test app written for this library only proves the library agrees with
  # itself; these prove it against software that has never heard of it.
  #
  # One job rather than a matrix entry: the installs take minutes, and the value
  # is in the applications rather than in the Python version.
  test-target-apps:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Chocolatey is preinstalled on the Windows images. Versions float on
      # purpose: the point of this job is to notice when a new release of one of
      # these applications breaks the assumptions the tests encode.
      - name: Install Notepad++, WinMerge and DB Browser for SQLite
        shell: pwsh
        run: |
          foreach ($pkg in @('notepadplusplus', 'winmerge', 'sqlitebrowser')) {
            Write-Host "::group::choco install $pkg"
            choco install $pkg -y --no-progress --ignore-checksums
            if ($LASTEXITCODE -ne 0) { Write-Host "$pkg install exit code $LASTEXITCODE" }
            Write-Host '::endgroup::'
          }
          # choco's exit code is unreliable across packages; the tests themselves
          # fail loudly when an executable is missing, which is the check that
          # matters. Reset so a non-zero code here does not end the job before
          # that check runs.
          $global:LASTEXITCODE = 0

      # Files is a packaged app with no installer on its GitHub releases (every
      # release carries zero assets). The packages live on the CDN its own
      # cd-sideload-stable.yml publishes to, addressed through an .appinstaller
      # manifest. The CDN rejects non-browser User-Agents with 403.
      - name: Install the .NET Desktop Runtime Files needs
        shell: pwsh
        run: |
          # Files 4.x is framework-dependent. Without this, it starts and shows a
          # #32770 message box instead of a window — and that dialog belongs to
          # Files.exe, so discovery by process name accepts it.
          choco install dotnet-desktopruntime -y --no-progress
          $global:LASTEXITCODE = 0
          & "$env:ProgramFiles\dotnet\dotnet.exe" --list-runtimes

      - name: Install Files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          $headers = @{ 'User-Agent' = $ua }
          $manifestUrl = 'https://cdn.files.community/files/stable/Files.Package.appinstaller'

          # Downloaded to a file rather than cast from the response. PowerShell 7
          # returns .Content as a byte array when the content type is not text,
          # and the CDN serves .appinstaller as one — so `[xml]$response.Content`
          # fails with 'Cannot convert value "System.Byte[]"'. Reading the file
          # back does not depend on the content type at all.
          $manifestFile = Join-Path $env:RUNNER_TEMP 'Files.appinstaller'
          Invoke-WebRequest -Uri $manifestUrl -Headers $headers -UseBasicParsing -OutFile $manifestFile -TimeoutSec 120
          $manifest = [xml](Get-Content -LiteralPath $manifestFile -Raw -Encoding UTF8)
          $bundleUrl = $manifest.AppInstaller.MainBundle.Uri
          if (-not $bundleUrl) { throw "no MainBundle Uri in $manifestUrl" }
          Write-Host "bundle: $bundleUrl (version $($manifest.AppInstaller.MainBundle.Version))"

          $bundle = Join-Path $env:RUNNER_TEMP 'Files.msixbundle'
          Invoke-WebRequest -Uri $bundleUrl -Headers $headers -UseBasicParsing -OutFile $bundle -TimeoutSec 600
          Write-Host ("downloaded {0:N1} MB" -f ((Get-Item $bundle).Length / 1MB))

          # No -DependencyPath. The .appinstaller lists VCLibs, but Files' own
          # manifest depends only on Microsoft.WindowsAppRuntime.2 — and handing
          # Add-AppxPackage a package the manifest does not reference fails the
          # whole install with 0x80073CF3.
          try {
            Add-AppxPackage -Path $bundle -ForceApplicationShutdown -ErrorAction Stop
          } catch {
            # 0x80070005 here is usually not a permission problem: MSIX
            # deployment needs the Process Lifetime Manager, which a
            # non-interactive session cannot reach. The deployment log says so
            # and the exception does not, so print it either way.
            Write-Host "::error::Add-AppxPackage failed: $($_.Exception.Message)"
            Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational' -MaxEvents 25 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("[{0}] id={1} {2}" -f $_.TimeCreated.ToString('HH:mm:ss'), $_.Id, ($_.Message -replace "`r?`n", ' ')) }
            throw
          }
          Get-AppxPackage -Name 'Files' | ForEach-Object { Write-Host "installed: $($_.PackageFullName)" }

      - name: Run target application tests
        env:
          # Turns "the application is not installed" from a skip into a failure.
          # Without it a broken install step would leave a green job that tested
          # nothing, which is the exact failure mode this job exists to catch.
          WINTEGRATE_REQUIRE_TARGET_APPS: "1"
          WINTEGRATE_RECORD_SUITE: "1"
        run: |
          pytest tests/ -v -s -m target_app

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-artifacts-target-apps
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

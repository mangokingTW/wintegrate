name: CI UI Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test-x64:
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-x64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

  test-arm64:
    needs: lint
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions setup-python provides official Windows ARM64 builds for Python 3.11+
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Sanitize ARM Runner (Disable WSL & Edge First Run OOBE)
        shell: pwsh
        run: |
          try {
            # 1. Disable WSL scheduled update tasks
            Get-ScheduledTask -TaskPath "\" -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -like "*wsl*" } | Disable-ScheduledTask -ErrorAction SilentlyContinue
            Get-ScheduledTask -TaskPath "\Microsoft\Windows\WSL\" -ErrorAction SilentlyContinue | Disable-ScheduledTask -ErrorAction SilentlyContinue

            # 2. Disable Microsoft Edge First Run Experience via Registry
            New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name "PreventFirstRunPage" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            New-Item -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Edge" -Name "HideFirstRunExperience" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

            # 3. Kill any running Edge / WSL background instances
            Get-Process -Name "wsl","msedge","msedgewebview2" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Runner sanitization completed"
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Windows ARM64
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            choco install ffmpeg -y --no-progress
          } catch {
            Write-Host "Choco installation attempt finished"
          }
          $ffmpegPaths = @(
            "C:\ProgramData\chocolatey\bin",
            "C:\Program Files\FFmpeg\bin"
          )
          foreach ($p in $ffmpegPaths) {
            if (Test-Path "$p\ffmpeg.exe") {
              Write-Host "Found FFmpeg at $p"
              $p | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              break
            }
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & live GUI recording tests
        run: |
          pytest tests/ -v -s

      - name: Upload Recording Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-artifacts-arm64-py${{ matrix.python-version }}
          path: |
            recording-artifacts/
            artifacts/
          if-no-files-found: ignore

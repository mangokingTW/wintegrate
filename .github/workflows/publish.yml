name: Publish to PyPI

# Publishes on a GitHub Release. workflow_dispatch is kept for a manual re-run of
# a release that failed after the tag was already cut.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify metadata and long description render
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      # A release tag must match the version in pyproject.toml, otherwise the
      # published artifact silently disagrees with the tag people cite.
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $VERSION / tag: $TAG"
          test "$VERSION" = "$TAG"

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

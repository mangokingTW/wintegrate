name: Publish to PyPI

# Publishes on a GitHub Release. workflow_dispatch is kept for a manual re-run of
# a release that failed after the tag was already cut.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # attest signs a provenance statement for the artifacts; id-token mints
      # the signing token for it.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify metadata and long description render
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      # A release tag must match the version in pyproject.toml, otherwise the
      # published artifact silently disagrees with the tag people cite.
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $VERSION / tag: $TAG"
          test "$VERSION" = "$TAG"

      # Signs a statement that these exact files were built from this commit by
      # this workflow run. Anyone can then check a download with
      # `gh attestation verify <file> --repo mangokingTW/wintegrate`, which is
      # evidence about provenance that no amount of reading the source provides.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: dist
          path: dist/
      # attestations: true makes the action mint PEP 740 attestations and upload
      # them alongside the files, so PyPI itself shows each release as verified
      # against this repository and workflow.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
